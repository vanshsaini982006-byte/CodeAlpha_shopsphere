<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="pageTitle">Product Details — ShopSphere</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
<div id="navbarRoot"></div>

<div class="container">
  <nav class="breadcrumb" id="breadcrumbRow"><a href="index.html">Home</a> <i class="fas fa-chevron-right" style="font-size:10px"></i> <a href="products.html">Shop</a> <i class="fas fa-chevron-right" style="font-size:10px"></i> <span id="breadcrumbCurrent">Loading...</span></nav>
</div>

<div class="container" id="productDetailContent">
  <div class="page-loading"><div class="spinner"></div></div>
</div>

<template id="detailTemplate">
  <div class="product-detail-grid">
    <div>
      <div class="gallery-main"><img id="mainImage" src="" alt="" /></div>
      <div class="gallery-thumbs" id="galleryThumbs"></div>
    </div>
    <div>
      <span class="pd-brand" id="pdBrand"></span>
      <h1 class="pd-title" id="pdTitle"></h1>
      <div class="pd-rating">
        <span class="stars" id="pdStars"></span>
        <span id="pdRatingText" style="color:var(--text-secondary);font-size:0.9rem;"></span>
      </div>
      <div class="pd-price">
        <span class="price-current" id="pdPriceCurrent"></span>
        <span class="price-original" id="pdPriceOriginal"></span>
        <span class="price-discount" id="pdDiscountPct"></span>
      </div>
      <span class="stock-status" id="pdStockStatus"></span>
      <p class="pd-desc" id="pdDescription"></p>
      <ul class="pd-features" id="pdFeatures"></ul>

      <div class="flex items-center gap-2" style="margin-top:20px;">
        <span style="font-weight:600;font-size:0.9rem;">Quantity</span>
        <div class="qty-selector">
          <button id="qtyMinus" type="button">−</button>
          <input type="text" id="qtyInput" value="1" readonly />
          <button id="qtyPlus" type="button">+</button>
        </div>
      </div>

      <div class="pd-actions">
        <button class="btn btn-primary" id="addToCartBtn" style="flex:1"><i class="fas fa-cart-plus"></i> Add to Cart</button>
        <button class="btn btn-accent" id="buyNowBtn" style="flex:1"><i class="fas fa-bolt"></i> Buy Now</button>
        <button class="btn-icon" id="pdWishlistBtn" aria-label="Add to wishlist" style="width:48px;height:48px;"><i class="far fa-heart"></i></button>
      </div>

      <div class="pd-meta-row">
        <span><i class="fas fa-truck"></i> Free delivery over ₹999</span>
        <span><i class="fas fa-rotate-left"></i> 7-day return policy</span>
        <span><i class="fas fa-shield-halved"></i> Secure checkout</span>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="specs">Specifications</button>
    <button class="tab-btn" data-tab="reviews">Reviews (<span id="reviewCount">0</span>)</button>
  </div>
  <div class="tab-content active" id="tab-specs">
    <table class="spec-table" id="specTable"></table>
  </div>
  <div class="tab-content" id="tab-reviews">
    <div id="writeReviewBox" class="card mb-3" style="display:none;">
      <h4 class="mb-2">Write a review</h4>
      <div class="flex gap-2 mb-2" id="starPicker">
        <i class="far fa-star" data-star="1"></i><i class="far fa-star" data-star="2"></i><i class="far fa-star" data-star="3"></i><i class="far fa-star" data-star="4"></i><i class="far fa-star" data-star="5"></i>
      </div>
      <textarea class="form-control" id="reviewComment" rows="3" placeholder="Share your thoughts about this product..."></textarea>
      <button class="btn btn-primary btn-sm mt-2" id="submitReviewBtn">Submit Review</button>
    </div>
    <div id="reviewsList"></div>
  </div>

  <section class="section" style="padding-left:0;padding-right:0;">
    <div class="section-header"><h2>Related Products</h2></div>
    <div class="product-grid" id="relatedGrid"></div>
  </section>
</template>

<div id="footerRoot"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/product-card.js"></script>
<script src="js/product-detail.js"></script>
</body>
</html>
