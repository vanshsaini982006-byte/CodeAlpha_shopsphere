<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout — ShopSphere</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
<div id="navbarRoot"></div>

<div class="container section">
  <h1 class="mb-2" style="font-size:1.8rem;">Checkout</h1>
  <div class="checkout-steps">
    <div class="checkout-step active" id="step1Tab">1. Shipping Address</div>
    <div class="checkout-step" id="step2Tab">2. Payment Method</div>
    <div class="checkout-step" id="step3Tab">3. Confirmation</div>
  </div>

  <div id="checkoutContent"><div class="page-loading"><div class="spinner"></div></div></div>
</div>

<template id="checkoutTemplate">
  <div class="checkout-layout">
    <div>
      <!-- Step 1: Address -->
      <div class="card" id="addressStep">
        <h3 class="mb-2">Shipping Address</h3>
        <div id="savedAddresses"></div>
        <button class="btn btn-outline btn-sm mt-2" id="addAddressBtn"><i class="fas fa-plus"></i> Add New Address</button>

        <div id="newAddressForm" style="display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border-color);">
          <div class="form-row">
            <div class="form-group"><label>Full Name</label><input class="form-control" id="addrFullName" /></div>
            <div class="form-group"><label>Phone</label><input class="form-control" id="addrPhone" /></div>
          </div>
          <div class="form-group"><label>Street Address</label><input class="form-control" id="addrStreet" /></div>
          <div class="form-row">
            <div class="form-group"><label>City</label><input class="form-control" id="addrCity" /></div>
            <div class="form-group"><label>State</label><input class="form-control" id="addrState" /></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Postal Code</label><input class="form-control" id="addrPostal" /></div>
            <div class="form-group"><label>Country</label><input class="form-control" id="addrCountry" value="India" /></div>
          </div>
          <button class="btn btn-primary btn-sm" id="saveAddressBtn">Save Address</button>
        </div>

        <button class="btn btn-primary mt-3" id="toStep2Btn" disabled>Continue to Payment <i class="fas fa-arrow-right"></i></button>
      </div>

      <!-- Step 2: Payment -->
      <div class="card" id="paymentStep" style="display:none;">
        <h3 class="mb-2">Payment Method</h3>
        <div class="payment-option selected" data-method="razorpay">
          <input type="radio" name="paymentMethod" value="razorpay" checked />
          <div><strong>Pay Online</strong><div style="font-size:0.8rem;color:var(--text-muted);">Card / UPI / Netbanking via Razorpay</div></div>
        </div>
        <div class="payment-option" data-method="cod">
          <input type="radio" name="paymentMethod" value="cod" />
          <div><strong>Cash on Delivery</strong><div style="font-size:0.8rem;color:var(--text-muted);">Pay when your order arrives</div></div>
        </div>
        <div class="flex gap-2 mt-3">
          <button class="btn btn-outline" id="backToStep1Btn">Back</button>
          <button class="btn btn-primary" id="placeOrderBtn" style="flex:1">Place Order <i class="fas fa-lock"></i></button>
        </div>
      </div>

      <!-- Step 3: Confirmation -->
      <div class="card text-center" id="confirmStep" style="display:none;padding:48px 24px;">
        <div class="icon-circle-lg" style="background:#DCFCE7;color:var(--color-success);"><i class="fas fa-check"></i></div>
        <h2 class="mt-2">Order placed successfully!</h2>
        <p class="mt-1" style="color:var(--text-secondary)">Your order number is <strong id="confirmOrderNumber"></strong></p>
        <div class="flex gap-2 justify-between" style="max-width:320px;margin:24px auto 0;">
          <a href="orders.html" class="btn btn-outline" style="flex:1">View Orders</a>
          <a href="products.html" class="btn btn-primary" style="flex:1">Continue Shopping</a>
        </div>
      </div>
    </div>

    <div class="card">
      <h3 class="mb-2">Order Summary</h3>
      <div id="checkoutItemsList" style="max-height:280px;overflow-y:auto;"></div>
      <div class="summary-row"><span>Subtotal</span><span id="sumSubtotal"></span></div>
      <div class="summary-row" id="sumDiscountRow" style="display:none;"><span>Discount</span><span id="sumDiscount"></span></div>
      <div class="summary-row"><span>Shipping</span><span id="sumShipping"></span></div>
      <div class="summary-row"><span>Tax</span><span id="sumTax"></span></div>
      <div class="summary-row total"><span>Total</span><span id="sumTotal"></span></div>
    </div>
  </div>
</template>

<div id="footerRoot"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
