<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account — ShopSphere</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
<div id="navbarRoot"></div>

<div class="container">
  <div class="auth-card">
    <h1>Create your account</h1>
    <p>Join ShopSphere for a faster checkout experience</p>
    <form id="registerForm">
      <div class="form-group">
        <label for="name">Full name</label>
        <input type="text" id="name" class="form-control" required />
        <span class="form-error" id="nameError">Name is required</span>
      </div>
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" class="form-control" required />
        <span class="form-error" id="emailError">Please enter a valid email</span>
      </div>
      <div class="form-group">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" class="form-control" placeholder="Optional" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" required />
        <span class="form-error" id="passwordError">Password must be at least 6 characters</span>
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" class="form-control" required />
        <span class="form-error" id="confirmError">Passwords do not match</span>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="registerBtn">Create Account</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/register.js"></script>
</body>
</html>
