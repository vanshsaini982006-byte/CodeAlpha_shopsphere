<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — ShopSphere</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
<div id="navbarRoot"></div>

<div class="container">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p>Login to continue shopping on ShopSphere</p>

    <div class="card mb-2" style="background:var(--color-primary-light);border:none;padding:14px;">
      <strong style="font-size:0.82rem;">Demo accounts</strong>
      <div style="font-size:0.8rem;color:var(--text-secondary);margin-top:4px;line-height:1.6;">
        Admin: admin@shopsphere.com / Admin@123456<br />
        Customer: demo@shopsphere.com / Demo@123456
      </div>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" class="form-control" required />
        <span class="form-error" id="emailError">Please enter a valid email</span>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" required />
        <span class="form-error" id="passwordError">Password is required</span>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Login</button>
    </form>
    <p class="auth-switch">Don't have an account? <a href="register.html">Create one</a></p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/login.js"></script>
</body>
</html>
