<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Profile — ShopSphere</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
<div id="navbarRoot"></div>

<div class="container section" style="max-width:720px;">
  <h1 class="mb-3" style="font-size:1.8rem;">My Profile</h1>

  <div class="card mb-3">
    <h3 class="mb-2">Personal Information</h3>
    <form id="profileForm">
      <div class="form-row">
        <div class="form-group"><label>Full Name</label><input type="text" id="pName" class="form-control" required /></div>
        <div class="form-group"><label>Phone</label><input type="tel" id="pPhone" class="form-control" /></div>
      </div>
      <div class="form-group"><label>Email address</label><input type="email" id="pEmail" class="form-control" required /></div>
      <button type="submit" class="btn btn-primary" id="saveProfileBtn">Save Changes</button>
    </form>
  </div>

  <div class="card mb-3">
    <h3 class="mb-2">Change Password</h3>
    <form id="passwordForm">
      <div class="form-group"><label>New Password</label><input type="password" id="newPassword" class="form-control" placeholder="Leave blank to keep current password" /></div>
      <button type="submit" class="btn btn-outline">Update Password</button>
    </form>
  </div>

  <div class="card">
    <h3 class="mb-2">Saved Addresses</h3>
    <div id="addressList"></div>
    <button class="btn btn-outline btn-sm mt-2" id="addAddrBtn"><i class="fas fa-plus"></i> Add Address</button>
    <div id="addrForm" style="display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border-color);">
      <div class="form-group"><label>Street Address</label><input class="form-control" id="fStreet" /></div>
      <div class="form-row">
        <div class="form-group"><label>City</label><input class="form-control" id="fCity" /></div>
        <div class="form-group"><label>State</label><input class="form-control" id="fState" /></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Postal Code</label><input class="form-control" id="fPostal" /></div>
        <div class="form-group"><label>Country</label><input class="form-control" id="fCountry" value="India" /></div>
      </div>
      <label class="filter-option"><input type="checkbox" id="fDefault" /> Set as default address</label>
      <button class="btn btn-primary btn-sm mt-2" id="saveAddrBtn">Save Address</button>
    </div>
  </div>
</div>

<div id="footerRoot"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
